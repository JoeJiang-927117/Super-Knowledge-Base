name: Bug Report
description: Report a bug or unexpected behavior in ZHIXU
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Concise summary of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS (Windows/macOS/Linux), Node.js version, mode (cloud/lan_gpu/local)"
    validations:
      required: true
